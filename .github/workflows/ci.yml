name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck core
        run: npx tsc --noEmit -p packages/core/tsconfig.json
      - name: Typecheck web
        run: npx tsc --noEmit -p apps/web/tsconfig.json
      - name: Test
        run: npm test
      - name: Build
        run: npm run build -w @cabgen/web
